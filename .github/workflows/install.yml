name: install
on:
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  contents: read
jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL https://sombre.si/install | sh
          "$HOME/.local/bin/sombre" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment').SetValue('Path', '%USERPROFILE%\tools', [Microsoft.Win32.RegistryValueKind]::ExpandString)
          irm https://sombre.si/install.ps1 | iex
          $raw = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($raw -notlike '%USERPROFILE%\tools;*') { throw "the installer flattened the user PATH: $raw" }
          & "$env:LOCALAPPDATA\sombre\bin\sombre.exe" --version
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains "$env:LOCALAPPDATA\sombre\bin")) { throw 'the install folder is not on the user PATH' }
          $kind = (Get-Item 'HKCU:\Environment').GetValueKind('Path')
          if ($kind -ne 'ExpandString') { throw "the user PATH became $kind instead of ExpandString" }
