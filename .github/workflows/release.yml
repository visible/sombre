name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release -p sombre --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -czf sombre-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sombre
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/sombre.exe -DestinationPath sombre-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: sombre-${{ matrix.target }}
          path: sombre-${{ matrix.target }}.*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum sombre-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sombre-*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" sombre-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
