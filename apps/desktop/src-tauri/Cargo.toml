[package]
name = "sombre-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
portable-pty = "0.9.0"
serde.workspace = true
sombre-core = { workspace = true, features = ["specta"] }
sombre-engine.workspace = true
sombre-harness = { workspace = true, features = ["specta"] }
sombre-pair.workspace = true
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
specta.workspace = true
specta-typescript = "=0.0.15"
tauri = { version = "2", features = ["protocol-asset", "specta"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSString",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKSnapshotConfiguration",
  "WKWebView",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
