[package]
name = "sombre"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sombre"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
qrcode = { version = "0.14", default-features = false }
clap.workspace = true
crossterm = "0.29.0"
ctrlc = "3.5.2"
serde_json.workspace = true
sombre-core.workspace = true
sombre-engine.workspace = true
sombre-harness.workspace = true
sombre-pair.workspace = true
textwrap = "0.16.4"
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "term"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
