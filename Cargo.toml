[workspace]
members = [
  "crates/core",
  "crates/harness",
  "crates/engine",
  "crates/pair",
  "crates/cli",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/core",
  "crates/harness",
  "crates/engine",
  "crates/pair",
  "crates/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sombre-core = { path = "crates/core" }
sombre-engine = { path = "crates/engine" }
sombre-harness = { path = "crates/harness" }
sombre-pair = { path = "crates/pair" }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tempfile = "3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = true
